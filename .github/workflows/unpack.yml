# One-time bootstrap: unpacks bootstrap.tar.gz (uploaded through the web UI) into the repo.
# Workflow files are added separately because GITHUB_TOKEN cannot write .github/workflows.
name: unpack-bootstrap
on:
  push:
    branches: [main]
    paths: ['bootstrap.tar.gz']
permissions: { contents: write, actions: write }
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          mkdir /tmp/b && tar -xzf bootstrap.tar.gz -C /tmp/b
          rm -rf /tmp/b/.github/workflows
          git rm -q bootstrap.tar.gz
          cp -a /tmp/b/. .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unpack bootstrap code (generated by Claude)"
          git push
