# Builds the contact-API image and pushes it to JD Cloud Container Registry (server pulls by digest).
name: api-image
on:
  push: { branches: [main], paths: [api/**] }
  workflow_dispatch:
permissions: { contents: read }
jobs:
  image:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Build and push
        env: { REG: '${{ vars.CR_REGISTRY }}', U: '${{ secrets.CR_USER }}', P: '${{ secrets.CR_PASS }}' }
        run: |
          docker build -t synaping-api:${{ github.sha }} api
          if [ -z "$REG" ] || [ -z "$U" ]; then echo "::warning::registry not configured — build only"; exit 0; fi
          echo "$P" | docker login "$REG" -u "$U" --password-stdin
          docker tag synaping-api:${{ github.sha }} "$REG/synaping/synaping-api:${{ github.sha }}"
          docker push "$REG/synaping/synaping-api:${{ github.sha }}"
